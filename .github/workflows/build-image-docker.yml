name: Construir imagen Docker

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      image-name:
        type: string
        default: ""

    secrets:
      AWS_ECR_PUBLISHER_ACCESS_KEY_ID:
        required: false
      AWS_ECR_PUBLISHER_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Construir imagen
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      IMAGE_NAME: ${{ inputs.image-name || github.event.repository.name }}
      IMAGE_TAG: sha-${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PUBLISH_TO_ECR: ${{ vars.AWS_IMAGE_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Obtener el código de la aplicación
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Comprobar configuración AWS
        if: env.PUBLISH_TO_ECR == 'true'
        shell: bash
        run: |
          if [[ -z "$AWS_REGION" || ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "Configura AWS_REGION y AWS_ACCOUNT_ID en GitHub Actions." >&2
            exit 1
          fi

      - name: Autenticar en AWS
        if: env.PUBLISH_TO_ECR == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ECR_PUBLISHER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_PUBLISHER_SECRET_ACCESS_KEY }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          force-skip-oidc: true

      - name: Comprobar si la imagen ya existe
        id: existing
        if: env.PUBLISH_TO_ECR == 'true'
        shell: bash
        run: |
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT

          if digest=$(aws ecr describe-images \
            --registry-id "$AWS_ACCOUNT_ID" \
            --repository-name "$IMAGE_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --no-cli-pager 2>"$error_file"); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La etiqueta ya existe; se conserva la imagen publicada."
            printf 'Digest existente: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'ImageNotFoundException' "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Autenticar Docker en ECR
        id: login-ecr
        if: env.PUBLISH_TO_ECR == 'true' && steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Preparar Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir y publicar si corresponde
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ env.PUBLISH_TO_ECR == 'true' }}
          load: ${{ env.PUBLISH_TO_ECR != 'true' }}
          tags: >-
            ${{ env.PUBLISH_TO_ECR == 'true'
                && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, env.IMAGE_NAME, env.IMAGE_TAG)
                || format('{0}:{1}', env.IMAGE_NAME, env.IMAGE_TAG) }}
